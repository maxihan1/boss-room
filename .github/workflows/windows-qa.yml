# 윈도우 QA 빌드(control_cli SDK)를 game-ci 로 굽고 내려받을 수 있게 올린 뒤 Test Commander 「Boss Room PC」(BRP)에도 zip 을 올린다 — VISION 윈도우 PC 에 깔 빌드(서버 배포 · 배포 신호는 안 함)
name: 윈도우 QA 빌드
on:
  push:
    branches: [showcase, windows-qa]
  workflow_dispatch:
concurrency:
  group: windows-qa-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  UNITY_VERSION: 6000.3.10f1
  # qa-deploy.yml 과 Test Commander kit 이 쓰는 판과 맞춘다 — 다르면 케이스가 부르는 명령(키 · 패드 · 값 기다리기)을 SDK 가 모른다
  CONTROL_CLI_REF: v0.16.4
jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - id: no
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          echo "build=${GITHUB_SHA::7}-$(TZ=Asia/Seoul date +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          if [ -z "$UNITY_LICENSE" ]; then echo "UNITY_LICENSE 가 없습니다"; exit 1; fi
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: Library-StandaloneWindows64-
      # 맥 전용 툴체인은 Linux 러너에 필요 없고 받다 깨질 수 있다(qa-deploy.yml 과 같다)
      - run: jq 'del(.dependencies["com.unity.toolchain.macos-arm64-linux"])' Packages/manifest.json > m.json && mv m.json Packages/manifest.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: control_cli 넣기
        run: |
          git clone -q --depth 1 -b "$CONTROL_CLI_REF" https://github.com/maxihan1/control_cli.git "$RUNNER_TEMP/control_cli"
          (cd "$RUNNER_TEMP/control_cli" && npm ci --silent && npm run build --silent)
          node "$RUNNER_TEMP/control_cli/dist/main.js" instrument "$GITHUB_WORKSPACE" --ref "$CONTROL_CLI_REF"
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildMethod: ShowcaseBuild.WindowsQa
          allowDirtyBuild: true
          versioning: None
      # 받은 zip 의 맨 위에 BossRoom.exe 가 온다 — 그대로 VISION 설치(zip) · 손으로 풀어 깔기 둘 다 된다
      - uses: actions/upload-artifact@v4
        with:
          name: bossroom-windows-qa-${{ steps.no.outputs.build }}
          path: |
            Builds/windows
            !Builds/windows/*_BurstDebugInformation_DoNotShip
          retention-days: 14
      # 폰 빌드는 qa-deploy.yml 이 ARG 에 올린다. PC 빌드는 따로 등록한 애플리케이션 BRP 의 토큰으로 올린다(게임 하나 = 애플리케이션 하나)
      - name: Test Commander 에 zip 올리기
        env:
          QAHUB_PC_CI_TOKEN: ${{ secrets.QAHUB_PC_CI_TOKEN }}
          BUILD: ${{ steps.no.outputs.build }}
        run: |
          [ -n "$QAHUB_PC_CI_TOKEN" ] || { echo "QAHUB_PC_CI_TOKEN 이 없어 올리기를 건너뜀"; exit 0; }
          (cd Builds/windows && zip -qr "$RUNNER_TEMP/bossroom-windows-qa.zip" . -x '*_BurstDebugInformation_DoNotShip/*')
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $QAHUB_PC_CI_TOKEN" -H 'Content-Type: application/zip' \
            --data-binary @"$RUNNER_TEMP/bossroom-windows-qa.zip" "https://commander.maxihan.com/api/builds?env=qa&buildNo=$BUILD"
